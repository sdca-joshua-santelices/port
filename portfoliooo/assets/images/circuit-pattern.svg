<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <!-- Main circuit grid -->
  <g stroke="#14efff" stroke-width="0.5" fill="none">
    <!-- Horizontal and vertical main lines -->
    <path d="M150,50 L350,50 M50,150 L50,350 M450,150 L450,350 M150,450 L350,450" />
    
    <!-- Corner connections -->
    <path d="M150,50 L150,150 L50,150 M350,50 L350,150 L450,150 M50,350 L150,350 L150,450 M450,350 L350,350 L350,450" />
    
    <!-- Inner grid -->
    <path d="M200,100 L300,100 M100,200 L100,300 M400,200 L400,300 M200,400 L300,400" />
    
    <!-- Connection points (nodes) -->
    <circle cx="150" cy="150" r="3" fill="#14efff" opacity="0.8" />
    <circle cx="350" cy="150" r="3" fill="#14efff" opacity="0.8" />
    <circle cx="150" cy="350" r="3" fill="#14efff" opacity="0.8" />
    <circle cx="350" cy="350" r="3" fill="#14efff" opacity="0.8" />
    
    <!-- Additional circuit traces -->
    <path d="M150,150 C180,180 220,180 250,150" />
    <path d="M350,150 C320,180 280,180 250,150" />
    <path d="M150,350 C180,320 220,320 250,350" />
    <path d="M350,350 C320,320 280,320 250,350" />
    
    <!-- Diagonal connections -->
    <path d="M100,100 L150,150 M400,100 L350,150 M100,400 L150,350 M400,400 L350,350" />
    
    <!-- Microchip-like patterns -->
    <rect x="225" y="225" width="50" height="50" rx="2" ry="2" />
    <rect x="230" y="230" width="40" height="40" rx="1" ry="1" />
    
    <!-- Additional nodes with pulse animation -->
    <circle cx="250" cy="250" r="5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <!-- Small dots representing connection points -->
    <g fill="#14efff" opacity="0.6">
      <circle cx="150" cy="50" r="1.5" />
      <circle cx="350" cy="50" r="1.5" />
      <circle cx="50" cy="150" r="1.5" />
      <circle cx="450" cy="150" r="1.5" />
      <circle cx="50" cy="350" r="1.5" />
      <circle cx="450" cy="350" r="1.5" />
      <circle cx="150" cy="450" r="1.5" />
      <circle cx="350" cy="450" r="1.5" />
    </g>
    
    <!-- Complex circuit paths -->
    <path d="M150,250 L200,250 L200,300 L250,300" />
    <path d="M350,250 L300,250 L300,300 L250,300" />
    <path d="M250,200 L300,200 L300,150 L350,150" />
    <path d="M250,200 L200,200 L200,150 L150,150" />
  </g>
  
  <!-- Additional decorative elements -->
  <g stroke="#a239ff" stroke-width="0.3" fill="none" opacity="0.6">
    <path d="M50,50 L100,100 M450,50 L400,100 M50,450 L100,400 M450,450 L400,400" />
    <circle cx="250" cy="250" r="100" />
    <circle cx="250" cy="250" r="75" />
  </g>
</svg>
