<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <!-- Definitions for reusable elements -->
  <defs>
    <!-- Glowing effect for lines -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Animated pulse effect -->
    <radialGradient id="nodeGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#14efff" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#14efff" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.2;0" dur="3s" repeatCount="indefinite"/>
      </stop>
    </radialGradient>
    
    <!-- Secondary node gradient -->
    <radialGradient id="secondaryNodeGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#a239ff" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a239ff" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.2;0" dur="4s" repeatCount="indefinite"/>
      </stop>
    </radialGradient>
    
    <!-- Data flow gradient -->
    <linearGradient id="dataFlowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14efff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#14efff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#14efff" stop-opacity="0"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    
    <linearGradient id="secondaryDataFlowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a239ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a239ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a239ff" stop-opacity="0"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="7s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="7s" repeatCount="indefinite" begin="1s"/>
    </linearGradient>
  </defs>
  
  <!-- Background grid lines -->
  <g stroke="#14efff" stroke-width="0.2" opacity="0.15">
    <!-- Horizontal grid lines -->
    <line x1="0" y1="100" x2="1000" y2="100"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="300" x2="1000" y2="300"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="0" y1="500" x2="1000" y2="500"/>
    <line x1="0" y1="600" x2="1000" y2="600"/>
    <line x1="0" y1="700" x2="1000" y2="700"/>
    <line x1="0" y1="800" x2="1000" y2="800"/>
    <line x1="0" y1="900" x2="1000" y2="900"/>
    
    <!-- Vertical grid lines -->
    <line x1="100" y1="0" x2="100" y2="1000"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="300" y1="0" x2="300" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="500" y1="0" x2="500" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
    <line x1="700" y1="0" x2="700" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
    <line x1="900" y1="0" x2="900" y2="1000"/>
  </g>
  
  <!-- Central CPU Node -->
  <g filter="url(#glow)">
    <rect x="450" y="450" width="100" height="100" stroke="#14efff" stroke-width="1" fill="none" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="460" y="460" width="80" height="80" stroke="#14efff" stroke-width="0.8" fill="none" opacity="0.7"/>
    <rect x="475" y="475" width="50" height="50" stroke="#14efff" stroke-width="0.6" fill="none" opacity="0.6"/>
    
    <!-- CPU connection points -->
    <circle cx="500" cy="450" r="3" fill="url(#nodeGradient)"/>
    <circle cx="500" cy="550" r="3" fill="url(#nodeGradient)"/>
    <circle cx="450" cy="500" r="3" fill="url(#nodeGradient)"/>
    <circle cx="550" cy="500" r="3" fill="url(#nodeGradient)"/>
  </g>
  
  <!-- Main connection paths -->
  <g stroke="#14efff" stroke-width="0.8" fill="none" opacity="0.5">
    <!-- Horizontal main paths -->
    <path d="M450,500 L100,500" stroke="url(#dataFlowGradient)"/>
    <path d="M550,500 L900,500" stroke="url(#secondaryDataFlowGradient)"/>
    
    <!-- Vertical main paths -->
    <path d="M500,450 L500,100" stroke="url(#dataFlowGradient)"/>
    <path d="M500,550 L500,900" stroke="url(#secondaryDataFlowGradient)"/>
    
    <!-- Data packet animations -->
    <circle cx="0" cy="0" r="2" fill="#14efff" opacity="0.8">
      <animateMotion path="M450,500 L100,500" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2" fill="#a239ff" opacity="0.8">
      <animateMotion path="M550,500 L900,500" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2" fill="#14efff" opacity="0.8">
      <animateMotion path="M500,450 L500,100" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2" fill="#a239ff" opacity="0.8">
      <animateMotion path="M500,550 L500,900" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Secondary connections -->
  <g stroke="#14efff" stroke-width="0.5" opacity="0.4">
    <!-- Top left quadrant -->
    <path d="M100,500 L100,300 L200,300 L200,200 L300,200" fill="none"/>
    <path d="M300,200 L300,100 L400,100" fill="none"/>
    <path d="M300,200 L400,200" fill="none"/>
    
    <!-- Bottom left quadrant -->
    <path d="M100,500 L100,700 L200,700 L200,800 L300,800" fill="none"/>
    <path d="M300,800 L300,900 L400,900" fill="none"/>
    <path d="M300,800 L400,800" fill="none"/>
    
    <!-- Top right quadrant -->
    <path d="M900,500 L900,300 L800,300 L800,200 L700,200" fill="none"/>
    <path d="M700,200 L700,100 L600,100" fill="none"/>
    <path d="M700,200 L600,200" fill="none"/>
    
    <!-- Bottom right quadrant -->
    <path d="M900,500 L900,700 L800,700 L800,800 L700,800" fill="none"/>
    <path d="M700,800 L700,900 L600,900" fill="none"/>
    <path d="M700,800 L600,800" fill="none"/>
  </g>
  
  <!-- Node points -->
  <g>
    <!-- Top left quadrant nodes -->
    <circle cx="100" cy="300" r="3" fill="url(#nodeGradient)"/>
    <circle cx="200" cy="300" r="3" fill="url(#nodeGradient)"/>
    <circle cx="200" cy="200" r="3" fill="url(#nodeGradient)"/>
    <circle cx="300" cy="200" r="3" fill="url(#nodeGradient)"/>
    <circle cx="300" cy="100" r="3" fill="url(#nodeGradient)"/>
    <circle cx="400" cy="100" r="3" fill="url(#nodeGradient)"/>
    <circle cx="400" cy="200" r="3" fill="url(#nodeGradient)"/>
    
    <!-- Bottom left quadrant nodes -->
    <circle cx="100" cy="700" r="3" fill="url(#secondaryNodeGradient)"/>
    <circle cx="200" cy="700" r="3" fill="url(#secondaryNodeGradient)"/>
    <circle cx="200" cy="800" r="3" fill="url(#secondaryNodeGradient)"/>
    <circle cx="300" cy="800" r="3" fill="url(#secondaryNodeGradient)"/>
    <circle cx="300" cy="900" r="3" fill="url(#secondaryNodeGradient)"/>
    <circle cx="400" cy="900" r="3" fill="url(#secondaryNodeGradient)"/>
    <circle cx="400" cy="800" r="3" fill="url(#secondaryNodeGradient)"/>
    
    <!-- Top right quadrant nodes -->
    <circle cx="900" cy="300" r="3" fill="url(#secondaryNodeGradient)"/>
    <circle cx="800" cy="300" r="3" fill="url(#secondaryNodeGradient)"/>
    <circle cx="800" cy="200" r="3" fill="url(#secondaryNodeGradient)"/>
    <circle cx="700" cy="200" r="3" fill="url(#secondaryNodeGradient)"/>
    <circle cx="700" cy="100" r="3" fill="url(#secondaryNodeGradient)"/>
    <circle cx="600" cy="100" r="3" fill="url(#secondaryNodeGradient)"/>
    <circle cx="600" cy="200" r="3" fill="url(#secondaryNodeGradient)"/>
    
    <!-- Bottom right quadrant nodes -->
    <circle cx="900" cy="700" r="3" fill="url(#nodeGradient)"/>
    <circle cx="800" cy="700" r="3" fill="url(#nodeGradient)"/>
    <circle cx="800" cy="800" r="3" fill="url(#nodeGradient)"/>
    <circle cx="700" cy="800" r="3" fill="url(#nodeGradient)"/>
    <circle cx="700" cy="900" r="3" fill="url(#nodeGradient)"/>
    <circle cx="600" cy="900" r="3" fill="url(#nodeGradient)"/>
    <circle cx="600" cy="800" r="3" fill="url(#nodeGradient)"/>
  </g>
  
  <!-- Circuit components -->
  <g stroke="#14efff" stroke-width="0.4" fill="none" opacity="0.6">
    <!-- Resistor-like components -->
    <path d="M150,200 L170,200 L175,195 L185,205 L195,195 L205,205 L215,195 L225,205 L230,200 L250,200" />
    <path d="M750,200 L770,200 L775,195 L785,205 L795,195 L805,205 L815,195 L825,205 L830,200 L850,200" />
    <path d="M150,800 L170,800 L175,795 L185,805 L195,795 L205,805 L215,795 L225,805 L230,800 L250,800" />
    <path d="M750,800 L770,800 L775,795 L785,805 L795,795 L805,805 L815,795 L825,805 L830,800 L850,800" />
    
    <!-- Capacitor-like components -->
    <path d="M350,150 L350,170 M350,170 L350,180 M340,180 L360,180 M340,190 L360,190 M350,190 L350,200" />
    <path d="M650,150 L650,170 M650,170 L650,180 M640,180 L660,180 M640,190 L660,190 M650,190 L650,200" />
    <path d="M350,750 L350,770 M350,770 L350,780 M340,780 L360,780 M340,790 L360,790 M350,790 L350,800" />
    <path d="M650,750 L650,770 M650,770 L650,780 M640,780 L660,780 M640,790 L660,790 M650,790 L650,800" />
  </g>
  
  <!-- Binary code decorations -->
  <g font-family="monospace" font-size="8" fill="#14efff" opacity="0.2">
    <text x="100" y="150">01001010</text>
    <text x="200" y="250">10110101</text>
    <text x="300" y="350">11100011</text>
    <text x="700" y="250">00110011</text>
    <text x="600" y="350">10011001</text>
    <text x="400" y="750">11001100</text>
    <text x="500" y="650">01010101</text>
  </g>
  
  <!-- Large decorative circles -->
  <g fill="none" opacity="0.1">
    <circle cx="500" cy="500" r="300" stroke="#14efff" stroke-width="0.5">
      <animate attributeName="r" values="300;310;300" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="500" r="400" stroke="#a239ff" stroke-width="0.3">
      <animate attributeName="r" values="400;390;400" dur="25s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
